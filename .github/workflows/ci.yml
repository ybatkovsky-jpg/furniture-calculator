name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Линтер (фатальные ошибки)
        run: ruff check app --select F,E9
      - name: Тесты + покрытие (P2-17)
        # Порог 59 — фактический baseline на 2026-11-17 (59,1 %); цель 60 %
        # после G4, когда появятся тесты на image_analyzer/pdf_parser.
        # Ratchet не даёт покрытию упасть ниже.
        run: >
          python -m pytest -q
          --cov=app
          --cov-report=term-missing:skip-covered
          --cov-fail-under=59

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Для организаций нужен GITLEAKS_LICENSE; личный репозиторий — без него.
