services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: furniture
      POSTGRES_USER: furniture
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U furniture -d furniture"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://furniture:${POSTGRES_PASSWORD}@db:5432/furniture
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./pdfs:/app/pdfs
    restart: unless-stopped

volumes:
  pgdata:
