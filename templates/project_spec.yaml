project:
  name: "Рокоссовского 59-79"
  address: "г. Хабаровск, Рокоссовского, д.10/6, кв.46"

# ================================================================
# Кухня — позиции, которые AI НЕ видит на чертеже
# ================================================================
kitchen:
  # ── Холодильник ──
  refrigerator:
    hinges: {brand: Blum, count: 5}  # Петли для встраиваемого холодильника

  # ── Ящики в нижней тумбе ──
  drawers:
    # Внутренний ящик (для столовых приборов)
    internal:
      model: "500 Soft"
      count: 1
    # Фасадные ящики Alphalux Crystal Soft
    facades:
      - {brand: Alphalux, model: "Crystal Soft", height_mm: 133.5, width_mm: 500, count: 1}
      - {brand: Alphalux, model: "Crystal Soft", height_mm: 180.5, width_mm: 500, count: 1}
    # LED-подсветка ящиков
    led:
      brand: ALPHALUX
      model: "CRYSTAL"
      count: 2
      batteries_aaa: 12   # 6 шт × 2 ящика
    # Направляющие
    guides:
      brand: Firmax
      model: "Push-to-open 3D"
      length_mm: 500
      count: 2

  # ── Дополнительная фурнитура и комплектующие ──
  additional:
    - {name: "Бутылочница BOYARD 150", count: 1, unit: "шт"}
    - {name: "Цоколь ПВХ Rehau 4м", count: 2, unit: "шт"}
    - {name: "GOLA профиль G-образный LED 6м", count: 1, unit: "шт"}
    - {name: "Лоток для столовых приборов пластиковый", count: 1, unit: "шт"}
    - {name: "Сушка Боярд в верхнюю базу (до 900мм)", count: 1, unit: "шт"}
    - {name: "Гигиенический поддон (до 900мм)", count: 1, unit: "шт"}
